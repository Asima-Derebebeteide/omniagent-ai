services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omniagent
      POSTGRES_PASSWORD: omniagent
      POSTGRES_DB: omniagent
    ports:
      - "5432:5432"
    volumes:
      - omniagent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniagent -d omniagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://omniagent:omniagent@postgres:5432/omniagent
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  omniagent_pg:
